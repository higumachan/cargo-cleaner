[package]
name = "cargo-cleaner"
version = "0.1.5"
edition = "2024"
rust-version = "1.85"
authors = ["Yuta Hinokuma <yuta.hinokuma725@gmail.com>"]
license = "MIT"
homepage = "https://github.com/higumachan/cargo-cleaner"
repository = "https://github.com/higumachan/cargo-cleaner"
exclude = ["test-environment/"]
readme = "README.md"
description = "A cross-platform TUI tool to clean up your cargo cache."
categories = ["development-tools", "command-line-interface"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[dependencies]
crossterm = "0.29.0"
num_threads = { version = "0.1.7", features = [] }
num_cpus = "1.17.0"
crossbeam-channel = { version = "0.5.17", features = [] }
dirs = { version = "7.0.0", features = [] }
cargo_toml = "1.0.1"
anyhow = { version = "1.0.104", features = ["backtrace"] }
itertools = "0.15.0"
atomic-wait = "1.1.0"
clap = { version = "4.6.6", features = ["derive"] }
ratatui = { version = "0.29.0", features = ["all-widgets"] }
uuid = { version = "1.26.0", features = ["serde", "v4", "fast-rng"] }

[dev-dependencies]
ratatui = { version = "0.29.0", features = ["all-widgets"] }
crossterm = "0.29.0"
